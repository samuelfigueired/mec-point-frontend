<section class="dashboard-root">
  <div class="panel">
    <p class="eyebrow">sessao ativa</p>
    <h1>Login confirmado</h1>
    <p class="message">Voce foi redirecionado para esta pagina depois de autenticar com sucesso.</p>

    <div class="token-box">
      <span class="label">Token salvo</span>
      <code>{{ token }}</code>
    </div>

    <button type="button" class="button" (click)="logout()">Sair</button>
  </div>
</section>
