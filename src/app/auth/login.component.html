<section class="auth-root">
  <div class="auth-panel">
    <div class="brand" aria-hidden="true"></div>
    <h2 class="title">faça seu login</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="visually-hidden" for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="email" autocomplete="username" />

      <label class="visually-hidden" for="password">Senha</label>
      <input id="password" type="password" formControlName="password" placeholder="senha" autocomplete="current-password" />

      <button type="submit" class="submit" [disabled]="loading">{{ loading ? 'Entrando...' : 'Entrar' }}</button>
    </form>

    <p class="helper">não tem uma conta? <a routerLink="/signup">crie agora</a></p>

    <div *ngIf="error" class="error" role="alert">{{ error }}</div>
  </div>
</section>
