<html lang="pt-br">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Reset global para limpar margens e aplicar o fundo escuro idêntico à foto */

      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #4a4a4a; /* O cinza escuro de fundo da imagem 2 */
      font-family: 'Montserrat', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Força o app-root a ocupar a tela toda */
    app-root {
      display: block;
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <app-root></app-root>
